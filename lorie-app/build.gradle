apply plugin: 'com.android.application'
apply from: '../lorie/version.gradle'

// Pocket Linux Display changes compared to upstream Termux:X11 (see NOTICE.md):
//  * applicationId app.pocketlinux.x11
//  * the sharedUid flavor is gone (it only makes sense inside the Termux app)
//  * only arm64-v8a and x86_64 are built
//  * the Termux companion package (.deb / .pkg.tar.xz) is no longer built
//  * the receivers that accept the X server connection are protected by a permission, see
//    plReceiverPermission below.

// Permission a sender needs to talk to the receivers declared in lorie/src/main/AndroidManifest.xml.
//   default:                          app.pocketlinux.x11.permission.CONNECT (normal permission,
//                                     apps opt in with <uses-permission>)
//   ./gradlew assembleDebug -PplOpenReceiver=true
//                                     android.permission.INTERNET, which the adb shell user also
//                                     holds. Use it only for local testing with `adb shell am
//                                     broadcast`; never publish such a build.
def connectPermission = 'app.pocketlinux.x11.permission.CONNECT'
def receiverPermission = project.hasProperty('plOpenReceiver') ? 'android.permission.INTERNET' : connectPermission

android {
    namespace 'com.termux.x11.app'
    compileSdkVersion 34
    ndkVersion termuxX11NdkVersion
    defaultConfig {
        applicationId "app.pocketlinux.x11"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName termuxX11VersionName
        manifestPlaceholders = [plReceiverPermission: receiverPermission]
        ndk.abiFilters 'arm64-v8a', 'x86_64'
    }

    // Debug key from upstream, shared by every fork build. Good enough for the debug APK that
    // GitHub releases ship. Replace with a private release key before publishing anywhere else.
    signingConfigs.debug {
        storeFile file('testkey_untrusted.jks')
        keyAlias 'alias'
        storePassword 'xrj45yWGLbsO7W0v'
        keyPassword 'xrj45yWGLbsO7W0v'
    }

    compileOptions.sourceCompatibility JavaVersion.VERSION_1_9
    compileOptions.targetCompatibility JavaVersion.VERSION_1_9
    buildTypes.debug {
        signingConfig signingConfigs.debug
        minifyEnabled true
        shrinkResources true
        proguardFiles 'proguard-rules.pro'
    }
}

// The release workflow and the Pocket Linux app look for this file name.
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set("pocketlinux-x11-${variant.buildType}.apk")
        }
    }
}

dependencies {
    implementation project(':lorie')
}
